# Standalone-repository template: GitHub discovers this file only when
# cuda-python-lab is itself the repository root. The parent repository has
# .github/workflows/cuda-practice-autograding.yml for the nested layout.
name: Standalone CUDA lab autograding
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      gpu:
        description: 'Use trusted pre-provisioned self-hosted CUDA runner'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy numba scipy pytest
      - run: python autograder.py --simulator
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-report
          path: result/autograder_report.json
  gpu:
    if: github.event_name == 'workflow_dispatch' && inputs.gpu && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: nvidia-smi
      - run: python autograder.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-report
          path: result/autograder_report.json